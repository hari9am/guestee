name: Build companion installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install companion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Companion/requirements.txt pyinstaller

      - name: Test companion core
        working-directory: Companion
        run: python -m unittest test_core -v

      - name: Bundle companion runtime
        working-directory: Companion
        run: >-
          pyinstaller --noconfirm --clean --onedir --windowed --name Gestuee
          --collect-all torch --collect-all mediapipe --collect-all cv2
          --collect-all pystray --collect-all PIL --hidden-import tkinter
          --hidden-import pystray._win32 --icon gestuee-icon.ico
          --add-data "gestuee-icon.png;." --add-data "gestuee-icon.ico;." app.py

      - name: Verify packaged Windows icon
        shell: pwsh
        working-directory: Companion
        run: |
          if (-not (Test-Path "dist/Gestuee/_internal/gestuee-icon.ico")) {
            throw "PyInstaller did not include gestuee-icon.ico in the runtime bundle."
          }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build setup file
        shell: pwsh
        working-directory: Companion
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { $compiler = (Get-Command ISCC.exe).Source }
          & $compiler "/DAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: gestuee-windows
          path: Companion/dist/installer/Gestuee-Setup.exe

  macos-installer:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install companion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Companion/requirements.txt pyinstaller

      - name: Test companion core
        working-directory: Companion
        run: python -m unittest test_core -v

      - name: Bundle companion runtime
        working-directory: Companion
        run: >-
          pyinstaller --noconfirm --clean --onedir --name Gestuee
          --collect-all torch --collect-all mediapipe --collect-all cv2
          --collect-all pystray --collect-all PIL --hidden-import tkinter
          --hidden-import pystray._darwin --add-data "gestuee-icon.png:." app.py

      - name: Package macOS bundle
        working-directory: Companion
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "dist/Gestuee" "dist/Gestuee-macOS.zip" || true
          cp install-macos.command dist/
          zip -j "dist/Gestuee-macOS.zip" install-macos.command

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: gestuee-macos
          path: Companion/dist/Gestuee-macOS.zip

  linux-installer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install companion dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v '^torch' Companion/requirements.txt > /tmp/requirements-linux.txt
          python -m pip install -r /tmp/requirements-linux.txt pyinstaller
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple "torch==2.6.0+cpu"

      - name: Test companion core
        working-directory: Companion
        run: python -m unittest test_core -v

      - name: Bundle companion runtime
        working-directory: Companion
        run: >-
          pyinstaller --noconfirm --clean --onedir --name Gestuee
          --collect-all torch --collect-all mediapipe --collect-all cv2
          --collect-all pystray --collect-all PIL --hidden-import tkinter
          --hidden-import pystray._gtk --add-data "gestuee-icon.png:." app.py

      - name: Package Linux bundle
        working-directory: Companion
        run: |
          mkdir -p dist
          tar -czf "dist/Gestuee-Linux-x64.tar.gz" dist/Gestuee install-linux.sh gestuee-icon.png

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: gestuee-linux
          path: Companion/dist/Gestuee-Linux-x64.tar.gz

  publish-release:
    needs: [windows-installer, macos-installer, linux-installer]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish release files
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/gestuee-windows/Gestuee-Setup.exe
            release-artifacts/gestuee-macos/Gestuee-macOS.zip
            release-artifacts/gestuee-linux/Gestuee-Linux-x64.tar.gz
          generate_release_notes: true
          make_latest: true