name: Build companion installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install companion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Companion/requirements.txt pyinstaller

      - name: Test companion core
        working-directory: Companion
        run: python -m unittest test_core -v

      - name: Bundle companion runtime
        working-directory: Companion
        run: >-
          pyinstaller --noconfirm --clean --onedir --windowed --name Gustee
          --collect-all torch --collect-all mediapipe --collect-all cv2
          --collect-all pystray --collect-all PIL --hidden-import tkinter
          --hidden-import pystray._win32 --icon gustee-icon.ico
          --add-data "gustee-icon.png;." app.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build setup file
        shell: pwsh
        working-directory: Companion
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { $compiler = (Get-Command ISCC.exe).Source }
          & $compiler "/DAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: gustee-windows
          path: Companion/dist/installer/Gustee-Setup.exe

  macos-installer:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install companion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Companion/requirements.txt pyinstaller

      - name: Test companion core
        working-directory: Companion
        run: python -m unittest test_core -v

      - name: Bundle companion runtime
        working-directory: Companion
        run: >-
          pyinstaller --noconfirm --clean --onedir --name Gustee
          --collect-all torch --collect-all mediapipe --collect-all cv2
          --collect-all pystray --collect-all PIL --hidden-import tkinter
          --hidden-import pystray._darwin --add-data "gustee-icon.png:." app.py

      - name: Package macOS bundle
        working-directory: Companion
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "dist/Gustee" "dist/Gustee-macOS.zip" || true
          cp install-macos.command dist/
          zip -j "dist/Gustee-macOS.zip" install-macos.command

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: gustee-macos
          path: Companion/dist/Gustee-macOS.zip

  linux-installer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install companion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Companion/requirements.txt pyinstaller

      - name: Test companion core
        working-directory: Companion
        run: python -m unittest test_core -v

      - name: Bundle companion runtime
        working-directory: Companion
        run: >-
          pyinstaller --noconfirm --clean --onedir --name Gustee
          --collect-all torch --collect-all mediapipe --collect-all cv2
          --collect-all pystray --collect-all PIL --hidden-import tkinter
          --hidden-import pystray._gtk --add-data "gustee-icon.png:." app.py

      - name: Package Linux bundle
        working-directory: Companion
        run: |
          mkdir -p dist
          tar -czf "dist/Gustee-Linux-x64.tar.gz" dist/Gustee install-linux.sh gustee-icon.png

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: gustee-linux
          path: Companion/dist/Gustee-Linux-x64.tar.gz

  publish-release:
    needs: [windows-installer, macos-installer, linux-installer]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish release files
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/gustee-windows/Gustee-Setup.exe
            release-artifacts/gustee-macos/Gustee-macOS.zip
            release-artifacts/gustee-linux/Gustee-Linux-x64.tar.gz
          generate_release_notes: true
          make_latest: true