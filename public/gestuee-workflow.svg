<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Gestuee gesture-to-action workflow</title>
  <desc id="description">A seven-step overview of connecting the Gestuee website to the local desktop companion, granting camera consent, capturing and recognizing hand gestures, checking launch conditions, and opening an approved app. A lower lane shows local custom gesture training.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171a19"/>
      <stop offset="1" stop-color="#111313"/>
    </linearGradient>
    <linearGradient id="title-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#293322"/>
      <stop offset="1" stop-color="#20291c"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M1 1 8 5 1 9" fill="none" stroke="#b3f33a" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/>
    </marker>
    <style>
      text { font-family: Manrope, "Segoe UI", Arial, sans-serif; }
      .muted { fill: #a7ada5; }
      .bright { fill: #f0f3ed; }
      .lime { fill: #b3f33a; }
      .card { fill: #1d211f; stroke: #343a34; stroke-width: 1.5; }
      .subcard { fill: #202622; stroke: #394334; stroke-width: 1.3; }
      .icon-stroke { fill: none; stroke: #b3f33a; stroke-linecap: round; stroke-linejoin: round; stroke-width: 3; }
      .small-stroke { fill: none; stroke: #a7ada5; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="1000" rx="24" fill="url(#background)"/>
  <path d="M34 166H1566" stroke="#2b302b"/>

  <rect x="432" y="34" width="736" height="100" rx="18" fill="url(#title-bg)" stroke="#607443" stroke-width="1.5"/>
  <circle cx="478" cy="84" r="24" fill="#b3f33a"/>
  <path d="M467 86a11 11 0 0 1 22 0m-27-6a16 16 0 0 1 32 0m-37-6a21 21 0 0 1 42 0m-21 15v7" fill="none" stroke="#182015" stroke-linecap="round" stroke-width="3"/>
  <circle cx="491" cy="62" r="3.5" fill="#182015"/>
  <text x="822" y="76" text-anchor="middle" class="bright" font-size="31" font-weight="750">Gestuee</text>
  <text x="822" y="108" text-anchor="middle" class="muted" font-size="17">From your hand gesture to your next action</text>

  <text x="52" y="195" class="lime" font-size="13" font-weight="700" letter-spacing="2">LIVE RECOGNITION</text>
  <text x="1548" y="195" text-anchor="end" class="muted" font-size="13">Runs on your computer with the Gestuee companion</text>

  <!-- Workflow cards -->
  <g>
    <rect class="card" x="40" y="220" width="200" height="280" rx="14"/>
    <rect x="40" y="220" width="200" height="5" rx="2.5" fill="#b3f33a"/>
    <circle cx="64" cy="254" r="14" fill="#b3f33a"/>
    <text x="64" y="259" text-anchor="middle" fill="#182015" font-size="13" font-weight="800">1</text>
    <text x="86" y="259" class="bright" font-size="16" font-weight="700">Connect</text>
    <rect x="96" y="296" width="88" height="56" rx="6" class="small-stroke"/>
    <path d="M105 306h70v37h-70zm-15 52h100l-8 8H98z" class="small-stroke"/>
    <circle cx="139" cy="324" r="8" class="icon-stroke"/>
    <path d="M135 324h8m-4-4v8" class="icon-stroke"/>
    <text x="140" y="394" text-anchor="middle" class="bright" font-size="15" font-weight="650">Pair the website</text>
    <text x="140" y="422" text-anchor="middle" class="muted" font-size="12.5">
      <tspan x="140">Use the one-time key</tspan>
      <tspan x="140" dy="19">from your companion.</tspan>
    </text>
    <rect x="73" y="462" width="134" height="22" rx="11" fill="#283221"/>
    <text x="140" y="477" text-anchor="middle" class="lime" font-size="10.5" font-weight="700">LOCAL CONNECTION</text>
  </g>

  <g>
    <rect class="card" x="266" y="220" width="200" height="280" rx="14"/>
    <rect x="266" y="220" width="200" height="5" rx="2.5" fill="#b3f33a"/>
    <circle cx="290" cy="254" r="14" fill="#b3f33a"/>
    <text x="290" y="259" text-anchor="middle" fill="#182015" font-size="13" font-weight="800">2</text>
    <text x="312" y="259" class="bright" font-size="16" font-weight="700">Give consent</text>
    <path d="M366 290 394 301v22c0 20-12 33-28 41-16-8-28-21-28-41v-22z" class="icon-stroke"/>
    <path d="m354 324 9 9 17-19" class="icon-stroke"/>
    <text x="366" y="394" text-anchor="middle" class="bright" font-size="15" font-weight="650">Allow camera access</text>
    <text x="366" y="422" text-anchor="middle" class="muted" font-size="12.5">
      <tspan x="366">Approve in the companion.</tspan>
      <tspan x="366" dy="19">No consent, no capture.</tspan>
    </text>
    <rect x="306" y="462" width="120" height="22" rx="11" fill="#283221"/>
    <text x="366" y="477" text-anchor="middle" class="lime" font-size="10.5" font-weight="700">YOU STAY IN CONTROL</text>
  </g>

  <g>
    <rect class="card" x="492" y="220" width="200" height="280" rx="14"/>
    <rect x="492" y="220" width="200" height="5" rx="2.5" fill="#b3f33a"/>
    <circle cx="516" cy="254" r="14" fill="#b3f33a"/>
    <text x="516" y="259" text-anchor="middle" fill="#182015" font-size="13" font-weight="800">3</text>
    <text x="538" y="259" class="bright" font-size="16" font-weight="700">Capture</text>
    <rect x="548" y="298" width="88" height="60" rx="9" class="icon-stroke"/>
    <path d="M565 298 573 288h37l8 10" class="icon-stroke"/>
    <circle cx="592" cy="328" r="16" class="icon-stroke"/>
    <circle cx="592" cy="328" r="6" class="small-stroke"/>
    <text x="592" y="394" text-anchor="middle" class="bright" font-size="15" font-weight="650">Read camera frames</text>
    <text x="592" y="422" text-anchor="middle" class="muted" font-size="12.5">
      <tspan x="592">A local worker processes</tspan>
      <tspan x="592" dy="19">the live camera stream.</tspan>
    </text>
    <rect x="554" y="462" width="76" height="22" rx="11" fill="#283221"/>
    <text x="592" y="477" text-anchor="middle" class="lime" font-size="10.5" font-weight="700">ON DEVICE</text>
  </g>

  <g>
    <rect class="card" x="718" y="220" width="200" height="280" rx="14"/>
    <rect x="718" y="220" width="200" height="5" rx="2.5" fill="#b3f33a"/>
    <circle cx="742" cy="254" r="14" fill="#b3f33a"/>
    <text x="742" y="259" text-anchor="middle" fill="#182015" font-size="13" font-weight="800">4</text>
    <text x="764" y="259" class="bright" font-size="16" font-weight="700">Track your hand</text>
    <path d="M806 357c-7-7-10-17-10-27v-19c0-7 10-7 10 0v15-30c0-7 10-7 10 0v26-34c0-7 10-7 10 0v34-27c0-7 10-7 10 0v35l5-12c3-7 12-4 9 4l-10 29c-4 11-12 17-25 17h-1c-4 0-7-4-8-11z" class="small-stroke"/>
    <g fill="#b3f33a">
      <circle cx="806" cy="311" r="3.2"/><circle cx="816" cy="303" r="3.2"/><circle cx="826" cy="298" r="3.2"/>
      <circle cx="836" cy="306" r="3.2"/><circle cx="846" cy="320" r="3.2"/><circle cx="806" cy="326" r="3.2"/>
      <circle cx="816" cy="326" r="3.2"/><circle cx="826" cy="326" r="3.2"/><circle cx="836" cy="326" r="3.2"/>
    </g>
    <text x="818" y="394" text-anchor="middle" class="bright" font-size="15" font-weight="650">Find hand landmarks</text>
    <text x="818" y="422" text-anchor="middle" class="muted" font-size="12.5">
      <tspan x="818">MediaPipe tracks the hand</tspan>
      <tspan x="818" dy="19">for gesture recognition.</tspan>
    </text>
    <rect x="777" y="462" width="82" height="22" rx="11" fill="#283221"/>
    <text x="818" y="477" text-anchor="middle" class="lime" font-size="10.5" font-weight="700">LANDMARKS</text>
  </g>

  <g>
    <rect class="card" x="944" y="220" width="200" height="280" rx="14"/>
    <rect x="944" y="220" width="200" height="5" rx="2.5" fill="#b3f33a"/>
    <circle cx="968" cy="254" r="14" fill="#b3f33a"/>
    <text x="968" y="259" text-anchor="middle" fill="#182015" font-size="13" font-weight="800">5</text>
    <text x="990" y="259" class="bright" font-size="16" font-weight="700">Recognize</text>
    <g class="icon-stroke">
      <circle cx="1003" cy="306" r="5"/><circle cx="1003" cy="328" r="5"/><circle cx="1003" cy="350" r="5"/>
      <circle cx="1038" cy="317" r="5"/><circle cx="1038" cy="339" r="5"/><circle cx="1073" cy="328" r="5"/>
      <path d="m1008 306 25 9m-25 13h25m-25 13 25-9m10-6 25 11m-25-11 25-11"/>
    </g>
    <text x="1044" y="394" text-anchor="middle" class="bright" font-size="15" font-weight="650">Classify the gesture</text>
    <text x="1044" y="422" text-anchor="middle" class="muted" font-size="12.5">
      <tspan x="1044">Built-in gestures and your</tspan>
      <tspan x="1044" dy="19">custom PyTorch model.</tspan>
    </text>
    <rect x="991" y="462" width="106" height="22" rx="11" fill="#283221"/>
    <text x="1044" y="477" text-anchor="middle" class="lime" font-size="10.5" font-weight="700">ON DEVICE</text>
  </g>

  <g>
    <rect class="card" x="1170" y="220" width="200" height="280" rx="14"/>
    <rect x="1170" y="220" width="200" height="5" rx="2.5" fill="#b3f33a"/>
    <circle cx="1194" cy="254" r="14" fill="#b3f33a"/>
    <text x="1194" y="259" text-anchor="middle" fill="#182015" font-size="13" font-weight="800">6</text>
    <text x="1216" y="259" class="bright" font-size="16" font-weight="700">Check trigger</text>
    <path d="M1238 300h74m-74 27h74m-74 27h74" class="small-stroke"/>
    <circle cx="1262" cy="300" r="7" fill="#1d211f" stroke="#b3f33a" stroke-width="3"/>
    <circle cx="1292" cy="327" r="7" fill="#1d211f" stroke="#b3f33a" stroke-width="3"/>
    <circle cx="1277" cy="354" r="7" fill="#1d211f" stroke="#b3f33a" stroke-width="3"/>
    <text x="1270" y="394" text-anchor="middle" class="bright" font-size="15" font-weight="650">Confirm it is steady</text>
    <text x="1270" y="422" text-anchor="middle" class="muted" font-size="12.5">
      <tspan x="1270">Confidence, hold time and</tspan>
      <tspan x="1270" dy="19">cooldown help prevent misfires.</tspan>
    </text>
    <rect x="1213" y="462" width="114" height="22" rx="11" fill="#283221"/>
    <text x="1270" y="477" text-anchor="middle" class="lime" font-size="10.5" font-weight="700">LAUNCH GATE</text>
  </g>

  <g>
    <rect class="card" x="1396" y="220" width="164" height="280" rx="14"/>
    <rect x="1396" y="220" width="164" height="5" rx="2.5" fill="#b3f33a"/>
    <circle cx="1420" cy="254" r="14" fill="#b3f33a"/>
    <text x="1420" y="259" text-anchor="middle" fill="#182015" font-size="13" font-weight="800">7</text>
    <text x="1442" y="259" class="bright" font-size="16" font-weight="700">Take action</text>
    <rect x="1434" y="296" width="88" height="66" rx="7" class="small-stroke"/>
    <path d="M1434 311h88m-74-8h2m7 0h2m7 0h2" class="small-stroke"/>
    <path d="m1467 340 9 9 19-23" class="icon-stroke"/>
    <text x="1478" y="394" text-anchor="middle" class="bright" font-size="15" font-weight="650">Open your target</text>
    <text x="1478" y="422" text-anchor="middle" class="muted" font-size="12.5">
      <tspan x="1478">Approved apps or</tspan>
      <tspan x="1478" dy="19">HTTPS websites only.</tspan>
    </text>
    <rect x="1423" y="462" width="110" height="22" rx="11" fill="#283221"/>
    <text x="1478" y="477" text-anchor="middle" class="lime" font-size="10.5" font-weight="700">SHELL DISABLED</text>
  </g>

  <!-- Direction arrows -->
  <g fill="none" stroke="#b3f33a" stroke-width="2.2" marker-end="url(#arrow)">
    <path d="M244 360h15"/><path d="M470 360h15"/><path d="M696 360h15"/>
    <path d="M922 360h15"/><path d="M1148 360h15"/><path d="M1374 360h15"/>
  </g>

  <!-- Custom training lane -->
  <rect x="40" y="550" width="1520" height="334" rx="18" fill="#191f18" stroke="#465639" stroke-width="1.5"/>
  <text x="76" y="594" class="lime" font-size="13" font-weight="700" letter-spacing="2">TEACH GESTUEE A NEW GESTURE</text>
  <text x="1524" y="594" text-anchor="end" class="muted" font-size="13">Your samples and trained model stay on this computer</text>
  <path d="M76 612H1524" stroke="#343d30"/>

  <rect class="subcard" x="76" y="644" width="380" height="160" rx="13"/>
  <circle cx="112" cy="680" r="18" fill="#b3f33a"/>
  <text x="112" y="686" text-anchor="middle" fill="#182015" font-size="15" font-weight="800">A</text>
  <text x="145" y="685" class="bright" font-size="18" font-weight="700">Record examples</text>
  <path d="M107 730h39v35h-39z" class="small-stroke"/>
  <circle cx="126.5" cy="747.5" r="8" class="icon-stroke"/>
  <text x="168" y="738" class="muted" font-size="13">
    <tspan x="168">Capture at least 30 samples for</tspan>
    <tspan x="168" dy="21">each custom hand pose.</tspan>
  </text>

  <rect class="subcard" x="610" y="644" width="380" height="160" rx="13"/>
  <circle cx="646" cy="680" r="18" fill="#b3f33a"/>
  <text x="646" y="686" text-anchor="middle" fill="#182015" font-size="15" font-weight="800">B</text>
  <text x="679" y="685" class="bright" font-size="18" font-weight="700">Train locally</text>
  <g class="icon-stroke">
    <circle cx="657" cy="737" r="5"/><circle cx="657" cy="759" r="5"/>
    <circle cx="684" cy="748" r="5"/><circle cx="711" cy="737" r="5"/><circle cx="711" cy="759" r="5"/>
    <path d="m662 737 17 9m-17 13 17-9m10-2 17-11m-17 11 17 11"/>
  </g>
  <text x="738" y="738" class="muted" font-size="13">
    <tspan x="738">PyTorch learns to classify your</tspan>
    <tspan x="738" dy="21">custom gesture from landmarks.</tspan>
  </text>

  <rect class="subcard" x="1144" y="644" width="380" height="160" rx="13"/>
  <circle cx="1180" cy="680" r="18" fill="#b3f33a"/>
  <text x="1180" y="686" text-anchor="middle" fill="#182015" font-size="15" font-weight="800">C</text>
  <text x="1213" y="685" class="bright" font-size="18" font-weight="700">Map and use</text>
  <path d="M1170 737h40v29h-40z" class="small-stroke"/>
  <path d="M1177 746h26m-26 7h17m-17 7h21" class="icon-stroke"/>
  <text x="1227" y="738" class="muted" font-size="13">
    <tspan x="1227">Assign an approved app or HTTPS</tspan>
    <tspan x="1227" dy="21">site, then start recognition.</tspan>
  </text>

  <g fill="none" stroke="#b3f33a" stroke-width="2.2" marker-end="url(#arrow)">
    <path d="M468 724h132"/><path d="M1002 724h132"/>
  </g>
  <path d="M1334 810v31H276v-31" fill="none" stroke="#667b4c" stroke-dasharray="6 6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="800" y="860" text-anchor="middle" class="muted" font-size="12">Custom model is added alongside built-in gestures</text>

  <!-- Privacy footer -->
  <circle cx="70" cy="936" r="13" fill="#283221"/>
  <path d="M64 936h12m-6-6v12" class="icon-stroke" stroke-width="2"/>
  <text x="96" y="941" class="bright" font-size="14" font-weight="650">Private by design</text>
  <text x="246" y="941" class="muted" font-size="13">Camera frames, samples, models, settings and history remain local. The camera pauses when you pause the session.</text>
  <text x="1530" y="941" text-anchor="end" class="lime" font-size="12" font-weight="700">GESTUEE</text>
</svg>
