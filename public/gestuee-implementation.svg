<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title description">
  <title id="title">Gestuee implementation flow</title>
  <desc id="description">Eight implementation stages show the Gestuee browser workspace pairing with the local companion, camera consent and capture, MediaPipe hand landmarks, built-in and custom gesture classification, confidence and hold-time gating, safe action dispatch, and status and history updates. A separate local training flow records samples, trains a PyTorch model, and feeds the model into recognition.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171a19"/>
      <stop offset="1" stop-color="#111313"/>
    </linearGradient>
    <linearGradient id="title-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#293322"/>
      <stop offset="1" stop-color="#20291c"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M1 1 8 5 1 9" fill="none" stroke="#b3f33a" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M1 1 8 5 1 9" fill="none" stroke="#84907d" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"/>
    </marker>
    <style>
      text { font-family: Manrope, "Segoe UI", Arial, sans-serif; }
      .muted { fill: #a7ada5; }
      .bright { fill: #f0f3ed; }
      .lime { fill: #b3f33a; }
      .card { fill: #1d211f; stroke: #343a34; stroke-width: 1.5; }
      .subcard { fill: #202622; stroke: #394334; stroke-width: 1.3; }
      .icon-stroke { fill: none; stroke: #b3f33a; stroke-linecap: round; stroke-linejoin: round; stroke-width: 3; }
      .small-stroke { fill: none; stroke: #a7ada5; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="1080" rx="24" fill="url(#background)"/>

  <rect x="440" y="34" width="720" height="92" rx="17" fill="url(#title-bg)" stroke="#607443" stroke-width="1.5"/>
  <circle cx="488" cy="80" r="22" fill="#b3f33a"/>
  <path d="M479 82a9 9 0 0 1 18 0m-22-6a13 13 0 0 1 26 0m-30-6a17 17 0 0 1 34 0m-17 16v7" fill="none" stroke="#182015" stroke-linecap="round" stroke-width="2.7"/>
  <circle cx="500" cy="60" r="3" fill="#182015"/>
  <text x="828" y="75" text-anchor="middle" class="bright" font-size="29" font-weight="750">Gestuee Implementation</text>
  <text x="828" y="103" text-anchor="middle" class="muted" font-size="15">From pairing and camera input to a safe, local action</text>

  <text x="50" y="170" class="lime" font-size="12" font-weight="750" letter-spacing="1.6">RUNTIME IMPLEMENTATION · FOLLOW THE NUMBERED FLOW</text>
  <text x="1550" y="170" text-anchor="end" class="muted" font-size="11.5">Web workspace configures; the desktop companion performs local work</text>

  <!-- Top row, left to right -->
  <g>
    <rect class="card" x="48" y="202" width="340" height="246" rx="14"/>
    <rect x="48" y="202" width="340" height="5" rx="2.5" fill="#b3f33a"/>
    <circle cx="77" cy="237" r="15" fill="#b3f33a"/>
    <text x="77" y="242" text-anchor="middle" fill="#182015" font-size="13" font-weight="800">1</text>
    <text x="103" y="242" class="bright" font-size="16" font-weight="700">Configure in the workspace</text>
    <rect x="81" y="271" width="65" height="51" rx="6" class="small-stroke"/>
    <path d="M90 282h47m-47 9h36m-36 9h42m-29 21v8m-11 0h32" class="small-stroke"/>
    <text x="168" y="285" class="bright" font-size="13.5" font-weight="650">TanStack Start + React</text>
    <text x="168" y="308" class="muted" font-size="12">Choose gestures, targets,</text>
    <text x="168" y="327" class="muted" font-size="12">settings and training actions.</text>
    <path d="M80 355h276" stroke="#343a34"/>
    <text x="80" y="382" class="muted" font-size="11.5">The browser sends commands; it never</text>
    <text x="80" y="401" class="muted" font-size="11.5">opens the OS camera or launches apps.</text>
    <rect x="80" y="414" width="128" height="20" rx="10" fill="#283221"/>
    <text x="144" y="428" text-anchor="middle" class="lime" font-size="9.5" font-weight="700">WEB WORKSPACE</text>
  </g>

  <g>
    <rect class="card" x="438" y="202" width="340" height="246" rx="14"/>
    <rect x="438" y="202" width="340" height="5" rx="2.5" fill="#b3f33a"/>
    <circle cx="467" cy="237" r="15" fill="#b3f33a"/>
    <text x="467" y="242" text-anchor="middle" fill="#182015" font-size="13" font-weight="800">2</text>
    <text x="493" y="242" class="bright" font-size="16" font-weight="700">Pair with the companion</text>
    <path d="M480 277h72v52h-72z" class="small-stroke"/>
    <path d="M491 289h50m-50 10h37m-37 10h42" class="icon-stroke" stroke-width="2"/>
    <text x="573" y="287" class="bright" font-size="13.5" font-weight="650">Authenticated local API</text>
    <text x="573" y="310" class="muted" font-size="12">Ephemeral pairing key</text>
    <text x="573" y="329" class="muted" font-size="12">Loopback · 127.0.0.1:8765</text>
    <path d="M470 355h276" stroke="#343a34"/>
    <text x="470" y="382" class="muted" font-size="11.5">Origin validation + authorization</text>
    <text x="470" y="401" class="muted" font-size="11.5">Protect companion requests and status.</text>
    <rect x="470" y="414" width="142" height="20" rx="10" fill="#283221"/>
    <text x="541" y="428" text-anchor="middle" class="lime" font-size="9.5" font-weight="700">LOCAL + PAIRED</text>
  </g>

  <g>
    <rect class="card" x="828" y="202" width="340" height="246" rx="14"/>
    <rect x="828" y="202" width="340" height="5" rx="2.5" fill="#b3f33a"/>
    <circle cx="857" cy="237" r="15" fill="#b3f33a"/>
    <text x="857" y="242" text-anchor="middle" fill="#182015" font-size="13" font-weight="800">3</text>
    <text x="883" y="242" class="bright" font-size="16" font-weight="700">Consent, then capture</text>
    <path d="M895 276 925 287v22c0 18-12 30-30 39-18-9-30-21-30-39v-22z" class="icon-stroke"/>
    <path d="m883 308 9 9 17-20" class="icon-stroke"/>
    <text x="944" y="290" class="bright" font-size="13.5" font-weight="650">Desktop tray consent</text>
    <text x="944" y="313" class="muted" font-size="12">Explicit permission each run</text>
    <text x="944" y="332" class="muted" font-size="12">Camera worker uses OpenCV.</text>
    <path d="M860 355h276" stroke="#343a34"/>
    <text x="860" y="382" class="muted" font-size="11.5">No consent = camera remains closed.</text>
    <text x="860" y="401" class="muted" font-size="11.5">Pause stops capture and releases camera.</text>
    <rect x="860" y="414" width="133" height="20" rx="10" fill="#283221"/>
    <text x="926" y="428" text-anchor="middle" class="lime" font-size="9.5" font-weight="700">LOCAL CAMERA</text>
  </g>

  <g>
    <rect class="card" x="1218" y="202" width="334" height="246" rx="14"/>
    <rect x="1218" y="202" width="334" height="5" rx="2.5" fill="#b3f33a"/>
    <circle cx="1247" cy="237" r="15" fill="#b3f33a"/>
    <text x="1247" y="242" text-anchor="middle" fill="#182015" font-size="13" font-weight="800">4</text>
    <text x="1273" y="242" class="bright" font-size="16" font-weight="700">Extract hand landmarks</text>
    <path d="M1296 329c-6-5-8-12-8-20v-17c0-6 8-6 8 0v12-26c0-6 8-6 8 0v22-29c0-6 8-6 8 0v29-23c0-6 8-6 8 0v29l5-10c3-6 10-3 8 3l-9 24c-4 9-10 14-21 14h-1c-4 0-6-3-6-8z" class="small-stroke"/>
    <g fill="#b3f33a">
      <circle cx="1296" cy="293" r="2.8"/><circle cx="1304" cy="282" r="2.8"/><circle cx="1312" cy="276" r="2.8"/>
      <circle cx="1320" cy="285" r="2.8"/><circle cx="1328" cy="300" r="2.8"/><circle cx="1296" cy="307" r="2.8"/>
      <circle cx="1304" cy="307" r="2.8"/><circle cx="1312" cy="307" r="2.8"/><circle cx="1320" cy="307" r="2.8"/>
    </g>
    <text x="1360" y="286" class="bright" font-size="13.5" font-weight="650">MediaPipe Hands</text>
    <text x="1360" y="309" class="muted" font-size="12">21 points → 63 values</text>
    <text x="1360" y="328" class="muted" font-size="12">Normalize position and scale.</text>
    <path d="M1250 355h270" stroke="#343a34"/>
    <text x="1250" y="382" class="muted" font-size="11.5">Frames and landmarks stay on-device.</text>
    <text x="1250" y="401" class="muted" font-size="11.5">No camera upload to the hosted UI.</text>
    <rect x="1250" y="414" width="130" height="20" rx="10" fill="#283221"/>
    <text x="1315" y="428" text-anchor="middle" class="lime" font-size="9.5" font-weight="700">FEATURE INPUT</text>
  </g>

  <g fill="none" stroke="#b3f33a" stroke-width="2.3" marker-end="url(#arrow)">
    <path d="M390 323h41"/><path d="M780 323h41"/><path d="M1170 323h41"/>
  </g>

  <!-- Wrap from stage four to stage five -->
  <path d="M1552 323h22v203h-22" fill="none" stroke="#b3f33a" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Bottom row flows right to left -->
  <g>
    <rect class="card" x="1218" y="500" width="334" height="246" rx="14"/>
    <rect x="1218" y="500" width="334" height="5" rx="2.5" fill="#b3f33a"/>
    <circle cx="1247" cy="535" r="15" fill="#b3f33a"/>
    <text x="1247" y="540" text-anchor="middle" fill="#182015" font-size="13" font-weight="800">5</text>
    <text x="1273" y="540" class="bright" font-size="16" font-weight="700">Classify the gesture</text>
    <g class="icon-stroke" stroke-width="2.5">
      <circle cx="1276" cy="575" r="4"/><circle cx="1276" cy="595" r="4"/><circle cx="1276" cy="615" r="4"/>
      <circle cx="1306" cy="585" r="4"/><circle cx="1306" cy="605" r="4"/><circle cx="1336" cy="595" r="4"/>
      <path d="m1280 575 22 9m-22 11h22m-22 9 22-9m8 0 22 9m-22-9 22-9"/>
    </g>
    <text x="1360" y="582" class="bright" font-size="13.5" font-weight="650">Built-in recognizer</text>
    <text x="1360" y="605" class="muted" font-size="12">+ custom PyTorch classes</text>
    <text x="1360" y="624" class="muted" font-size="12">Emit gesture + confidence.</text>
    <path d="M1250 652h270" stroke="#343a34"/>
    <text x="1250" y="679" class="muted" font-size="11.5">Use raw landmarks for configured</text>
    <text x="1250" y="698" class="muted" font-size="11.5">cursor and desktop-control actions.</text>
    <rect x="1250" y="711" width="143" height="20" rx="10" fill="#283221"/>
    <text x="1321" y="725" text-anchor="middle" class="lime" font-size="9.5" font-weight="700">LOCAL INFERENCE</text>
  </g>

  <g>
    <rect class="card" x="828" y="500" width="340" height="246" rx="14"/>
    <rect x="828" y="500" width="340" height="5" rx="2.5" fill="#b3f33a"/>
    <circle cx="857" cy="535" r="15" fill="#b3f33a"/>
    <text x="857" y="540" text-anchor="middle" fill="#182015" font-size="13" font-weight="800">6</text>
    <text x="883" y="540" class="bright" font-size="16" font-weight="700">Stabilize the trigger</text>
    <path d="M888 579h104m-104 23h104m-104 23h104" class="small-stroke"/>
    <circle cx="912" cy="579" r="6" fill="#1d211f" stroke="#b3f33a" stroke-width="2.5"/>
    <circle cx="965" cy="602" r="6" fill="#1d211f" stroke="#b3f33a" stroke-width="2.5"/>
    <circle cx="937" cy="625" r="6" fill="#1d211f" stroke="#b3f33a" stroke-width="2.5"/>
    <text x="1013" y="585" class="bright" font-size="13.5" font-weight="650">LaunchGate checks</text>
    <text x="1013" y="608" class="muted" font-size="12">Confidence threshold</text>
    <text x="1013" y="627" class="muted" font-size="12">Hold duration + cooldown</text>
    <path d="M860 652h276" stroke="#343a34"/>
    <text x="860" y="679" class="muted" font-size="11.5">Require a steady recognized pose</text>
    <text x="860" y="698" class="muted" font-size="11.5">before triggering mapped behavior.</text>
    <rect x="860" y="711" width="121" height="20" rx="10" fill="#283221"/>
    <text x="920" y="725" text-anchor="middle" class="lime" font-size="9.5" font-weight="700">MISFIRE GUARD</text>
  </g>

  <g>
    <rect class="card" x="438" y="500" width="340" height="246" rx="14"/>
    <rect x="438" y="500" width="340" height="5" rx="2.5" fill="#b3f33a"/>
    <circle cx="467" cy="535" r="15" fill="#b3f33a"/>
    <text x="467" y="540" text-anchor="middle" fill="#182015" font-size="13" font-weight="800">7</text>
    <text x="493" y="540" class="bright" font-size="16" font-weight="700">Validate and dispatch</text>
    <path d="M486 579h52v53h-52z" class="small-stroke"/>
    <path d="M495 591h34m-34 10h26m-26 10h30" class="small-stroke"/>
    <path d="m503 624 8 8 17-19" class="icon-stroke"/>
    <text x="554" y="585" class="bright" font-size="13.5" font-weight="650">Approved target only</text>
    <text x="554" y="608" class="muted" font-size="12">Fixed executable allowlist</text>
    <text x="554" y="627" class="muted" font-size="12">HTTPS websites · shell=False</text>
    <path d="M470 652h276" stroke="#343a34"/>
    <text x="470" y="679" class="muted" font-size="11.5">Control actions use the companion's</text>
    <text x="470" y="698" class="muted" font-size="11.5">local desktop input controller.</text>
    <rect x="470" y="711" width="147" height="20" rx="10" fill="#283221"/>
    <text x="543" y="725" text-anchor="middle" class="lime" font-size="9.5" font-weight="700">SAFE DISPATCH</text>
  </g>

  <g>
    <rect class="card" x="48" y="500" width="340" height="246" rx="14"/>
    <rect x="48" y="500" width="340" height="5" rx="2.5" fill="#b3f33a"/>
    <circle cx="77" cy="535" r="15" fill="#b3f33a"/>
    <text x="77" y="540" text-anchor="middle" fill="#182015" font-size="13" font-weight="800">8</text>
    <text x="103" y="540" class="bright" font-size="16" font-weight="700">Return status and history</text>
    <path d="M80 577h59v49H80z" class="small-stroke"/>
    <path d="M89 588h40m-40 9h31m-31 9h35" class="icon-stroke" stroke-width="2"/>
    <text x="158" y="585" class="bright" font-size="13.5" font-weight="650">Companion response</text>
    <text x="158" y="608" class="muted" font-size="12">Gesture, confidence, session</text>
    <text x="158" y="627" class="muted" font-size="12">and launch result.</text>
    <path d="M80 652h276" stroke="#343a34"/>
    <text x="80" y="679" class="muted" font-size="11.5">Workspace polls local status and shows</text>
    <text x="80" y="698" class="muted" font-size="11.5">history from companion persistence.</text>
    <rect x="80" y="711" width="144" height="20" rx="10" fill="#283221"/>
    <text x="152" y="725" text-anchor="middle" class="lime" font-size="9.5" font-weight="700">FEEDBACK LOOP</text>
  </g>

  <!-- Bottom row arrows point from stage 5 back toward stage 8 -->
  <g fill="none" stroke="#b3f33a" stroke-width="2.3" marker-end="url(#arrow)">
    <path d="M1210 622h-37"/><path d="M820 622h-37"/><path d="M430 622h-37"/>
  </g>

  <!-- Custom model implementation lane -->
  <rect x="48" y="792" width="1504" height="205" rx="16" fill="#191f18" stroke="#465639" stroke-width="1.4"/>
  <text x="78" y="827" class="lime" font-size="12" font-weight="750" letter-spacing="1.5">CUSTOM MODEL IMPLEMENTATION · RUNS IN THE COMPANION</text>
  <text x="1522" y="827" text-anchor="end" class="muted" font-size="11.5">Recorded data and model weights remain on-device</text>
  <path d="M78 844h1444" stroke="#343d30"/>

  <rect class="subcard" x="80" y="865" width="380" height="94" rx="11"/>
  <circle cx="111" cy="895" r="15" fill="#b3f33a"/>
  <text x="111" y="900" text-anchor="middle" fill="#182015" font-size="12" font-weight="800">A</text>
  <text x="139" y="900" class="bright" font-size="14" font-weight="700">Record examples</text>
  <text x="104" y="932" class="muted" font-size="11.5">Capture at least 30 landmark samples per gesture.</text>

  <rect class="subcard" x="610" y="865" width="380" height="94" rx="11"/>
  <circle cx="641" cy="895" r="15" fill="#b3f33a"/>
  <text x="641" y="900" text-anchor="middle" fill="#182015" font-size="12" font-weight="800">B</text>
  <text x="669" y="900" class="bright" font-size="14" font-weight="700">Train and validate</text>
  <text x="634" y="932" class="muted" font-size="11.5">Train the PyTorch classifier and calculate accuracy.</text>

  <rect class="subcard" x="1140" y="865" width="380" height="94" rx="11"/>
  <circle cx="1171" cy="895" r="15" fill="#b3f33a"/>
  <text x="1171" y="900" text-anchor="middle" fill="#182015" font-size="12" font-weight="800">C</text>
  <text x="1199" y="900" class="bright" font-size="14" font-weight="700">Save and recognize</text>
  <text x="1164" y="932" class="muted" font-size="11.5">Store model.pt locally; load it into the gesture engine.</text>

  <g fill="none" stroke="#b3f33a" stroke-width="2" marker-end="url(#arrow)">
    <path d="M468 912h129"/><path d="M998 912h129"/>
  </g>
  <path d="M1330 859v-79h55v-25" fill="none" stroke="#84907d" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow-muted)"/>
  <text x="1400" y="779" class="muted" font-size="10">model.pt</text>

  <circle cx="70" cy="1030" r="12" fill="#283221"/>
  <path d="M64 1030h12m-6-6v12" class="icon-stroke" stroke-width="2"/>
  <text x="94" y="1035" class="bright" font-size="12.5" font-weight="650">Implementation boundary</text>
  <text x="270" y="1035" class="muted" font-size="11.5">Browser UI → paired loopback API → consented local camera/ML → validated action → local status and history</text>
  <text x="1530" y="1035" text-anchor="end" class="lime" font-size="11" font-weight="700">GESTUEE</text>
</svg>
